name: Drive Small Chunk Bridge

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Find latest snapshot
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="$(gh release list \
            --repo "$GITHUB_REPOSITORY" \
            --limit 1 \
            --json tagName \
            --jq '.[0].tagName')"
          test -n "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Snapshot: $TAG"

      - name: Download release in GitHub cloud
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.latest.outputs.tag }}"

          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'daizhigev20-data.tar.gz.part-*'

          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'daizhigev20-data.tar.gz.sha256'

          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'manifest.json'

      - name: Rebuild and verify archive
        shell: bash
        run: |
          set -euo pipefail
          cat daizhigev20-data.tar.gz.part-* > daizhigev20-data.tar.gz
          sha256sum -c daizhigev20-data.tar.gz.sha256
          ls -lh daizhigev20-data.tar.gz

      - name: Split into Drive-safe chunks
        shell: bash
        run: |
          set -euo pipefail
          split \
            -b 90m \
            -d \
            -a 3 \
            daizhigev20-data.tar.gz \
            daizhigev20-data.tar.gz.chunk-

          sha256sum daizhigev20-data.tar.gz.chunk-* > chunks.sha256
          test "$(ls daizhigev20-data.tar.gz.chunk-* | wc -l)" -eq 26
          ls -lh daizhigev20-data.tar.gz.chunk-*

      - name: Upload chunk 000
        uses: actions/upload-artifact@v4
        with:
          name: daizhige-chunk-000
          path: daizhigev20-data.tar.gz.chunk-000
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

      - name: Upload chunk 001
        uses: actions/upload-artifact@v4
        with:
